[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
memmap2 = "0.9.11"
rkyv = "0.8.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
